name: Deploy Bedrock Pack

on:
  push:
    branches:
      - claude/unified-version-spec-2eziqj
    paths:
      - "bedrock/behavior_pack/**"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known_hosts
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy behavior pack via rsync
        run: |
          rsync -avz --delete \
            bedrock/behavior_pack/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/minecraft/server/behavior_packs/minetrigger/"

      - name: TEMP add player to allowlist via server console
        run: |
          cat > /tmp/add_allowlist.sh << 'SCRIPT'
          #!/usr/bin/env bash
          set -x
          screen -S minecraft -X stuff $'allowlist add Yujiro1106\r'
          sleep 2
          echo "=== allowlist.json ==="
          cat /opt/minecraft/server/allowlist.json
          SCRIPT
          scp -o StrictHostKeyChecking=no /tmp/add_allowlist.sh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/add_allowlist.sh"
          ssh -o StrictHostKeyChecking=no "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "bash /tmp/add_allowlist.sh"
